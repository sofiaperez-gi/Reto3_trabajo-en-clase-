<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ordenar Arrays</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2>Ordenar Arrays de Cadenas</h2>
    <p>Ingrese nombres en la caja de texto de abajo y obtiene este listado el cual aparecerá en el área de texto</p>

    <div class="row">
      <input type="text" id="nombreInput" placeholder="Nombre">
      <button id="btnAgregar" class="btn">Agregar y ordenar nombre</button>
    </div>

    <h3>Nombres ordenados</h3>
    <textarea id="listaNombres" readonly placeholder="Aquí aparecerán los nombres ordenados"></textarea>

    <div class="row-end">
      <button id="btnLimpiar" class="btn">Limpiar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
